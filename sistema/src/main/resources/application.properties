spring.application.name=sistema
# ==========================================
# CONEXIÓN A BASE DE DATOS (MySQL / XAMPP)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/SistemaVentas_DB?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE JPA (ORM)
# ==========================================
# 'update' hace que Spring cree o actualice las tablas en MySQL automáticamente
spring.jpa.hibernate.ddl-auto=none
# Esto mostrará en tu consola las consultas SQL que Spring genera por detrás
spring.jpa.show-sql=true