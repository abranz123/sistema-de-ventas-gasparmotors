<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto | Gaspar Motors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fondo completamente oscuro como en tu Figma */
        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* La tarjeta blanca central */
        .modal-card {
            background: white;
            border-radius: 8px;
            padding: 35px;
            width: 100%;
            max-width: 450px;
        }

        /* Tipografía de los títulos y etiquetas */
        .form-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 25px;
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }

        /* Cajas de texto idénticas al diseño */
        .form-control, .form-select {
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            margin-bottom: 18px;
            padding: 10px 12px;
            color: #1e293b;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Botones divididos 50/50 */
        .btn-cancel {
            background: white;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-weight: 600;
            border-radius: 6px;
        }
        .btn-cancel:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
        .btn-create {
            background: #1d4ed8;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 6px;
        }
        .btn-create:hover {
            background: #1e3a8a;
            color: white;
        }
    </style>
</head>
<body>

<div class="modal-card">
    <div class="form-title">Nuevo Producto</div>

    <form th:action="@{/inventario/guardar}" th:object="${producto}" method="POST">
        <input type="hidden" th:field="*{id_producto}">

        <label class="form-label">Nombre del Producto</label>
        <input type="text" th:field="*{nombre_producto}" class="form-control" required>

        <label class="form-label">Categoría</label>
        <select th:field="*{categoria}" class="form-select" required>
            <option th:each="cat : ${categorias}"
                    th:value="${cat.id_categoria}"
                    th:text="${cat.nombre_categoria}"></option>
        </select>

        <label class="form-label">Precio (S/)</label>
        <input type="number" step="0.01" th:field="*{precio}" class="form-control" value="0" required>

        <label class="form-label">Stock Físico</label>
        <input type="number" th:field="*{stock}" class="form-control" value="0" required>

        <div class="d-flex gap-3 mt-2">
            <a href="/inventario" class="btn btn-cancel w-50 py-2 text-decoration-none text-center">Cancelar</a>

            <button type="submit" class="btn btn-create w-50 py-2">Crear</button>
        </div>
    </form>
</div>

</body>
</html>
